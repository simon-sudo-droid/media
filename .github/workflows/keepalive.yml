name: Daily digest trigger + health watchdog

# ── Why this runs ONCE A DAY, not every 10 minutes ───────────────
# Render's free tier allows 750 instance-hours per MONTH across the whole
# account. Pinging two services every 10 minutes keeps both awake 24/7, which
# needs ~1,488 hours/month — so the quota is exhausted mid-month and Render
# SUSPENDS the services ("This service has been suspended") until the 1st.
# That is exactly what happened 2026-08-30: digests stopped, the app went
# down, and it only recovered when September reset the quota.
#
# Letting the services sleep when idle keeps usage inside the free allowance.
# The trade-off is a ~50s cold start on the first visit after a quiet spell —
# far preferable to multi-day suspensions.
#
# The single daily run still:
#   1. builds the Industry Monitoring digest (/industry/cron), and
#   2. detects a service that connects but never responds (stale routing) and
#      redeploys it — needs the RENDER_API_KEY repo secret.
on:
  schedule:
    # Once daily at 05:10 UTC (08:10 in East Africa) — before the workday.
    - cron: "10 5 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      WEB_URL: https://editmentor-web.onrender.com/
      API_URL: https://editmentor-api.onrender.com/health
      WEB_SRV: srv-d8o34o48aovs73feaaeg
      API_SRV: srv-d8o341c8aovs73fe9fp0
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Trigger daily digest; redeploy anything that hangs
        run: |
          set -uo pipefail

          # Now that the services are allowed to sleep, a cold start is the
          # NORMAL case on this daily run and can take ~50-60s. Timeouts are
          # therefore 120s over three attempts — only a service that never
          # answers at all is treated as stuck (stale routing).
          check() {  # $1=url -> echoes the HTTP code ("000" means no response)
            local code
            for _ in 1 2 3; do
              code=$(curl -sS -o /dev/null -m 120 -w "%{http_code}" "$1" || echo 000)
              [ "$code" != "000" ] && break
              sleep 15
            done
            echo "$code"
          }

          redeploy() {  # $1=service id, $2=label
            if [ -z "${RENDER_API_KEY:-}" ]; then
              echo "::warning::$2 is not responding, but RENDER_API_KEY is not set — cannot self-heal. Add the secret to enable automatic recovery."
              return
            fi
            echo "::warning::$2 is not responding (stale routing) — triggering a fresh deploy."
            curl -sS -m 60 -X POST \
              "https://api.render.com/v1/services/$1/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}' \
              -o /dev/null -w "  deploy request -> %{http_code}\n" || true
          }

          echo "Checked at $(date -u)"

          WEB=$(check "$WEB_URL"); echo "web -> $WEB"
          [ "$WEB" = "000" ] && redeploy "$WEB_SRV" "editmentor-web"

          API=$(check "$API_URL"); echo "api -> $API"
          [ "$API" = "000" ] && redeploy "$API_SRV" "editmentor-api"

          # Idempotent daily trigger: builds the Industry Monitoring digest
          # once per day even if nobody has opened the page yet.
          curl -sS -m 120 -o /dev/null -w "cron -> %{http_code}\n" \
            https://editmentor-api.onrender.com/industry/cron || true

          exit 0
