# Render Blueprint — provisions the EditMentor AI web services.
# In the Render dashboard: New ▸ Blueprint ▸ connect this repo ▸ Apply.
#
# The PostgreSQL database lives on SUPABASE (not Render — Render's free
# Postgres expires every 30 days). Set DATABASE_URL in the Render dashboard
# (editmentor-api ▸ Environment) to the Supabase SESSION-POOLER connection
# string, e.g.:
#   postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
# (Use the session pooler on port 5432 — it is IPv4-compatible and works
# with SQLAlchemy; the app adds sslmode=require automatically.)

services:
  # ── Backend API (FastAPI) ──────────────────────────────────
  - type: web
    name: editmentor-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false                   # Supabase connection string — set in the dashboard (secret)
      - key: JWT_SECRET
        generateValue: true          # strong random secret
      - key: AI_PROVIDER
        value: mock                   # set to "openai"/"claude"/"gemini" + add a key to go live
      - key: GEMINI_API_KEY
        sync: false                   # set in the Render dashboard (do not commit secrets)
      - key: CORS_ORIGINS
        value: https://editmentor-web.onrender.com   # pinned to the frontend origin
      - key: FRONTEND_URL
        value: https://editmentor-web.onrender.com   # used to build password-reset links

  # ── Frontend (Next.js) ─────────────────────────────────────
  - type: web
    name: editmentor-web
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile.render
    envVars:
      # Baked into the client bundle at BUILD time → points the browser at the API.
      # Must be a literal value: Render does NOT resolve fromService/fromDatabase
      # references during Docker builds, only at runtime — so a `host` reference
      # would be empty at build and the bundle would fall back to localhost.
      - key: NEXT_PUBLIC_API_URL
        value: https://editmentor-api.onrender.com
