# Render Blueprint — provisions the full EditMentor AI stack in one click.
# In the Render dashboard: New ▸ Blueprint ▸ connect this repo ▸ Apply.
# Render reads this file and creates the database + both services, wiring the
# frontend to the backend automatically.

databases:
  - name: editmentor-db
    plan: free
    databaseName: editmentor
    user: editmentor

services:
  # ── Backend API (FastAPI) ──────────────────────────────────
  - type: web
    name: editmentor-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: editmentor-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # strong random secret
      - key: AI_PROVIDER
        value: mock                   # set to "openai"/"claude" + add a key to go live
      - key: CORS_ORIGINS
        value: "*"                    # Bearer-token auth, so wildcard is safe here

  # ── Frontend (Next.js) ─────────────────────────────────────
  - type: web
    name: editmentor-web
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile.render
    envVars:
      # Baked into the client bundle at build time → points the browser at the API.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: editmentor-api
          type: web
          property: host              # e.g. editmentor-api.onrender.com (api.ts adds https://)
