# Render Blueprint — provisions the full EditMentor AI stack in one click.
# In the Render dashboard: New ▸ Blueprint ▸ connect this repo ▸ Apply.
# Render reads this file and creates the database + both services, wiring the
# frontend to the backend automatically.

databases:
  - name: editmentor-db
    plan: free
    databaseName: editmentor
    user: editmentor

services:
  # ── Backend API (FastAPI) ──────────────────────────────────
  - type: web
    name: editmentor-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: editmentor-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # strong random secret
      - key: AI_PROVIDER
        value: mock                   # set to "openai"/"claude"/"gemini" + add a key to go live
      - key: GEMINI_API_KEY
        sync: false                   # set in the Render dashboard (do not commit secrets)
      - key: CORS_ORIGINS
        value: "*"                    # Bearer-token auth, so wildcard is safe here
      - key: FRONTEND_URL
        value: https://editmentor-web.onrender.com   # used to build password-reset links

  # ── Frontend (Next.js) ─────────────────────────────────────
  - type: web
    name: editmentor-web
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile.render
    envVars:
      # Baked into the client bundle at BUILD time → points the browser at the API.
      # Must be a literal value: Render does NOT resolve fromService/fromDatabase
      # references during Docker builds, only at runtime — so a `host` reference
      # would be empty at build and the bundle would fall back to localhost.
      - key: NEXT_PUBLIC_API_URL
        value: https://editmentor-api.onrender.com
